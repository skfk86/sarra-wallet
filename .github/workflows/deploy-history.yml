name: Deploy edge function (manual)

# نشر يدوي فقط لدوال Supabase (p2p، history، push-watch، support) أو إعداد الإشعارات (push-setup). لا يعمل تلقائياً أبداً.
# يحتاج سرّين في المستودع (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN : من supabase.com → Account → Access Tokens
# ويحتاج في Supabase نفسه (Edge Functions → Secrets): ETHERSCAN_API_KEY (Ethereum وPolygon) وNODEREAL_API_KEY (BNB Chain)، وMORALIS_API_KEY اختياري
on:
  workflow_dispatch:
    inputs:
      fn:
        description: 'الدالة'
        type: choice
        options: [p2p, history, push-watch, support, push-setup]
        default: p2p

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests (must pass before deploy)
        run: npm test
      - name: Check token
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::error::أضف SUPABASE_ACCESS_TOKEN في أسرار المستودع أولاً"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy
        if: inputs.fn != 'push-setup'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ${{ inputs.fn }} --project-ref osdojhpsfbcqguoctbpk --no-verify-jwt --use-api --yes
      # push-setup: ينشر الدوال الثلاث ثم يطبّق ترحيلي الإشعارات (018) وخزنة السجل (019) عبر Management API
      - name: Push notifications setup (functions + migration 018)
        if: inputs.fn == 'push-setup'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for f in push-watch p2p support; do supabase functions deploy $f --project-ref osdojhpsfbcqguoctbpk --no-verify-jwt --use-api --yes; done
          for m in 018_push 019_vault; do
            python3 -c "import json,sys;print(json.dumps({'query':open('supabase/migrations/'+sys.argv[1]+'.sql').read()}))" $m > /tmp/q.json
            code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/osdojhpsfbcqguoctbpk/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json)
            echo "migration $m HTTP $code"; head -c 600 /tmp/r.txt; echo
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::فشل تطبيق الترحيل $m"; exit 1; }
          done
          sleep 75
          echo "--- آخر تشغيل للماسح (من جدول cron) ---"
          python3 -c "import json;print(json.dumps({'query':\"select status, return_message, start_time from cron.job_run_details where jobid=(select jobid from cron.job where jobname='push-watch') order by start_time desc limit 2\"}))" > /tmp/q2.json
          curl -s -X POST "https://api.supabase.com/v1/projects/osdojhpsfbcqguoctbpk/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q2.json | head -c 800; echo
