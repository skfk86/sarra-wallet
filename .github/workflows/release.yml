name: Release (signed AAB + APK)

# مؤتمت بالكامل: يعمل تلقائياً بعد نجاح "Build Android APK" على main (ويمكن تشغيله يدوياً).
# المفتاح في أسرار المستودع فقط (يُنشئه "Setup signing key (one time)"). لا نشر تلقائي على Google Play.
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Load signing key from secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::لا يوجد مفتاح توقيع. شغّل مرة واحدة: Actions ← Setup signing key (one time)"; exit 1; fi
          echo "$KS" | base64 -d > release.jks

      - run: npm install
      - run: npm run vendor
      - name: Write build config (mainnet)
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          SARRA_NETWORK: mainnet
          SARRA_FEE_ADDRESS: ${{ vars.SARRA_FEE_ADDRESS || secrets.SARRA_FEE_ADDRESS }}
          SARRA_FEE_BPS: ${{ vars.SARRA_FEE_BPS || '50' }}
        run: npm run config
      - run: npx cap add android
      - run: npm run patch:android
      - name: Splash
        run: |
          pip install --quiet pillow
          python3 scripts/make-splash.py
      - run: npx cap sync android

      - name: Version
        run: |
          V=$(node -p "require('./package.json').version")
          CODE=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "VERSION=$V" >> $GITHUB_ENV

      - name: Build release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Sign
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KPW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p out
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.jks -storepass "$PW" -keypass "$KPW" \
            -signedjar out/sarra-$VERSION-release.aab android/app/build/outputs/bundle/release/app-release.aab "$ALIAS"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass "pass:$PW" --ks-key-alias "$ALIAS" --key-pass "pass:$KPW" --out out/sarra-$VERSION-release.apk aligned.apk
          $BT/apksigner verify out/sarra-$VERSION-release.apk && echo "✓ التوقيع صحيح"
          rm -f release.jks aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sarra-release-${{ env.VERSION }}
          path: out/
