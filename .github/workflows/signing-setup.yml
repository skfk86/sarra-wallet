name: Setup signing key (one time)

# يُشغَّل يدوياً مرة واحدة: يُنشئ مفتاح التوقيع وكلمة سر عشوائية، ويحفظهما مباشرة في أسرار المستودع.
# لا يُطبع أي سرّ ولا يُرفع أي ملف (المستودع عام). المطلوب: سرّ GH_PAT (رمز بصلاحية Secrets: write لهذا المستودع).
on:
  workflow_dispatch:
    inputs:
      replace:
        description: 'استبدال مفتاح موجود؟ (فقط إن لم ترفع التطبيق على Google Play بعد)'
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create key and store as secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
          REPLACE: ${{ inputs.replace }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::أضف السرّ GH_PAT أولاً (راجع docs/RELEASE.md)"; exit 1; fi
          if [ "$HAS_KEY" = "true" ] && [ "$REPLACE" != "true" ]; then echo "::error::يوجد مفتاح بالفعل. لاستبداله شغّل مع replace=true"; exit 1; fi
          PW=$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 40)
          echo "::add-mask::$PW"
          keytool -genkeypair -keystore release.jks -storetype PKCS12 -alias sarra -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Sarra Wallet, O=Sarra, C=SD" 2>/dev/null
          base64 -w0 release.jks | gh secret set ANDROID_KEYSTORE_B64 -R "$REPO"
          printf '%s' "$PW" | gh secret set ANDROID_KEYSTORE_PASSWORD -R "$REPO"
          printf '%s' "$PW" | gh secret set ANDROID_KEY_PASSWORD -R "$REPO"
          printf '%s' "sarra" | gh secret set ANDROID_KEY_ALIAS -R "$REPO"
          echo "بصمة الشهادة (عامة، للتحقق فقط):"
          keytool -list -keystore release.jks -storepass "$PW" | grep -i "SHA-256" || true
          shred -u release.jks
          echo "✓ حُفظ المفتاح وكلمة السر في أسرار المستودع. لا شيء منهما في السجل أو الملفات."
