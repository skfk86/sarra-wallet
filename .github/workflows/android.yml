name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      network:
        description: 'Network (nile or mainnet)'
        required: true
        default: 'mainnet'
        type: choice
        options: [nile, mainnet]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Run core tests
        run: npm test

      - name: Run UI tests (Chromium)
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          bash test/ui/run.sh

      - name: Copy vendor libraries
        run: npm run vendor

      - name: Write build config
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          SARRA_NETWORK: ${{ inputs.network || vars.SARRA_NETWORK || 'mainnet' }}
          SARRA_FEE_ADDRESS: ${{ vars.SARRA_FEE_ADDRESS || secrets.SARRA_FEE_ADDRESS }}
          SARRA_FEE_BPS: ${{ vars.SARRA_FEE_BPS || '50' }}
        run: npm run config

      - name: Add Android platform
        run: npx cap add android

      - name: Block screenshots (FLAG_SECURE), icon, permissions
        run: npm run patch:android

      - name: Splash screen with logo
        run: |
          pip install --quiet pillow
          python3 scripts/make-splash.py

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sarra-wallet-${{ inputs.network || vars.SARRA_NETWORK || 'mainnet' }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
