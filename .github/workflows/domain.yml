name: Domain setup (sarrapay.com)
# مرة واحدة بعد نقل الدومين إلى Cloudflare، ويُعاد تشغيله عند تعديل cloudflare/worker.js
# يحتاج سرّين: CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloudflare/**']
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOMAIN: sarrapay.com
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::أضف السر CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || { echo "::error::أضف السر CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: DNS for the main site (GitHub Pages)
        run: |
          api() { curl -sS -X "$1" "https://api.cloudflare.com/client/v4$2" -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' ${3:+--data "$3"}; }
          Z=$(api GET "/zones?name=$DOMAIN" | jq -r '.result[0].id // empty')
          [ -n "$Z" ] || { echo "::error::الدومين $DOMAIN غير موجود في حساب Cloudflare، أو صلاحية Zone:Read ناقصة في المفتاح"; exit 1; }
          echo "zone status: $(api GET "/zones/$Z" | jq -r .result.status)  (active = النقل اكتمل)"
          # نحذف سجلات الجذر وwww القديمة (صفحة الركن من Spaceship مثلاً) ثم ننشئ سجلات GitHub Pages
          for n in "$DOMAIN" "www.$DOMAIN"; do
            for id in $(api GET "/zones/$Z/dns_records?name=$n&per_page=100" | jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id'); do
              api DELETE "/zones/$Z/dns_records/$id" > /dev/null && echo "deleted old record on $n"
            done
          done
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            api POST "/zones/$Z/dns_records" "{\"type\":\"A\",\"name\":\"@\",\"content\":\"$ip\",\"proxied\":false,\"ttl\":1}" | jq -c '{ok:.success,ip:.result.content,err:.errors}'
          done
          api POST "/zones/$Z/dns_records" '{"type":"CNAME","name":"www","content":"skfk86.github.io","proxied":false,"ttl":1}' | jq -c '{ok:.success,www:.result.content,err:.errors}'
      - name: Deploy subdomains worker (api, pay, docs, dashboard)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
      - name: Check
        run: |
          sleep 20
          for u in https://api.sarrapay.com/v1/public/inv_00000000000000000000 https://pay.sarrapay.com/ https://docs.sarrapay.com/ https://sarrapay.com/; do
            echo "$u → HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u")"
          done
          echo "api 404 = يعمل (الفاتورة التجريبية غير موجودة). الموقع الرئيسي قد يأخذ حتى ساعة حتى يصدر GitHub الشهادة."
